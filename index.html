<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Riscos de Auditoria | Professor Moreira</title><style>
:root{--purple:#521080;--orange:#ef7428;--bg:#f6f3fb;--ink:#1c1730;--green:#147c48;--red:#b52a38}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}main{min-height:100dvh;max-width:980px;margin:auto;display:flex;flex-direction:column;padding:clamp(12px,3vw,30px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(13px,2vw,19px);font-weight:800;color:var(--purple);padding-bottom:12px}.track{height:9px;background:#e2d8ec;border-radius:20px;overflow:hidden}.track span{display:block;height:100%;background:var(--orange);transition:width .2s}.panel{flex:1;background:#fff;border:2px solid #eadff1;border-radius:24px;padding:clamp(20px,5vw,45px);margin:15px 0;box-shadow:0 8px 22px #3b15500b;display:flex;flex-direction:column;justify-content:center;gap:18px}.eyebrow{color:var(--orange);font-weight:900;font-size:clamp(16px,2.6vw,23px);text-transform:uppercase;letter-spacing:.04em}h1{font-size:clamp(35px,7vw,70px);line-height:1.12;margin:0;color:var(--purple)}h2{font-size:clamp(29px,5vw,52px);line-height:1.15;margin:0;color:var(--purple)}p{font-size:clamp(21px,3.6vw,32px);line-height:1.4;margin:0}.small{font-size:clamp(17px,2.8vw,24px)}.tag{font-weight:850;color:var(--orange)}.example{padding:18px 22px;background:#fff4ea;border-left:7px solid var(--orange);border-radius:12px}.concept{padding:18px;border:2px solid #e5d9ed;border-radius:14px}.concept strong{color:var(--purple)}.options{display:grid;gap:12px}.option{font:inherit;font-size:clamp(20px,3vw,29px);line-height:1.25;text-align:left;padding:18px 20px;border:2px solid #d6c7e0;border-radius:15px;background:#fff;color:var(--ink);cursor:pointer;font-weight:650}.option:disabled{cursor:default;opacity:1}.option.selected.correct,.option.correct{border-color:var(--green);background:#e7f8ee}.option.selected.wrong{border-color:var(--red);background:#fff0f1}.feedback{font-size:clamp(19px,3vw,27px);font-weight:650;padding:16px;border-radius:14px;background:#f4f0fa}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}footer{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;bottom:0;background:var(--bg);padding:10px 0 max(10px,env(safe-area-inset-bottom))}button.nav{border:0;border-radius:13px;padding:15px 18px;font-weight:800;font-size:clamp(16px,2.8vw,23px);color:white;background:var(--purple);cursor:pointer}button.nav.secondary{background:#e8deef;color:var(--purple)}button.nav:disabled{opacity:.35;cursor:not-allowed}.count{font-weight:800;font-size:clamp(15px,2vw,19px);color:#62576b}.center{text-align:center}.emoji{font-size:clamp(55px,11vw,110px)}.pill{display:inline-block;padding:8px 14px;background:#f5e9fc;border-radius:30px;color:var(--purple);font-weight:800;font-size:clamp(17px,2.6vw,24px)}@media(max-width:470px){main{padding:10px}.panel{padding:18px;border-radius:18px;gap:15px}footer{gap:5px}button.nav{padding:12px 11px}.option{padding:14px}header{font-size:13px}}
</style></head><body><main><header><span>📘 PROFESSOR MOREIRA</span><span id="score">Acertos: 0/0</span></header><div class="track"><span id="progress"></span></div><section id="screen" class="panel" aria-live="polite"></section><footer><button class="nav secondary" id="back">← Voltar</button><span class="count" id="count"></span><button class="nav secondary" id="restart">↻ Reiniciar</button><button class="nav" id="next">Avançar →</button></footer></main><script>
const concepts=[
{title:'Risco de Auditoria',icon:'📋',desc:'É o risco de o auditor expressar uma opinião de auditoria inadequada quando as demonstrações contábeis contêm distorção relevante.',note:'É função do risco de distorção relevante e do risco de detecção.'},
{title:'Risco de Distorção Relevante',icon:'⚠️',desc:'É o risco de as demonstrações contábeis conterem distorção relevante antes da auditoria.',note:'No nível das afirmações, compreende risco inerente e risco de controle.'},
{title:'Risco Inerente',icon:'🚨',desc:'É a suscetibilidade de uma afirmação a distorção que possa ser relevante, antes de considerar quaisquer controles relacionados.',note:'Pense: a natureza da operação traz possibilidade de erro.'},
{title:'Risco de Controle',icon:'🛡️',desc:'É o risco de que uma distorção relevante não seja prevenida ou detectada e corrigida tempestivamente pelos controles internos da entidade.',note:'Pense: os controles da empresa não funcionaram.'},
{title:'Risco de Detecção',icon:'🔎',desc:'É o risco de que os procedimentos executados pelo auditor para reduzir o risco de auditoria a um nível aceitavelmente baixo não detectem uma distorção existente que possa ser relevante.',note:'Pense: o auditor não identificou o erro.'}
];
const cases=[
{title:'O hospital',icon:'🏥',parts:[['🚨','Medicamentos caros estão sujeitos a vencimento, perdas e desvios. Essa suscetibilidade existe antes dos controles.'],['🛡️','O hospital não confere o estoque nem registra adequadamente as saídas.'],['🔎','O auditor examina os registros, mas não identifica uma falta relevante de medicamentos.']],qs:[['O risco de perda de medicamentos, antes dos controles, é:',0,'A própria natureza dos itens gera suscetibilidade a distorções.'],['O hospital não controla adequadamente as saídas. Isso representa:',1,'A deficiência está nos controles internos da entidade.'],['O auditor não encontra uma falta relevante de estoque. Qual é o risco?',2,'A falha é dos procedimentos de auditoria em detectar a distorção.']]},
{title:'O supermercado',icon:'🛒',parts:[['🚨','Produtos perecíveis podem vencer, estragar ou perder valor.'],['🛡️','A empresa não verifica adequadamente a validade nem as quantidades em estoque.'],['🔎','O auditor não percebe que produtos vencidos continuam registrados por valor relevante e inadequado.']],qs:[['A suscetibilidade de alimentos perecíveis a perdas caracteriza:',0,'É um risco presente antes de avaliar os controles.'],['A ausência de conferência de validade pela empresa caracteriza:',1,'O controle interno não previne ou detecta e corrige o problema.'],['O auditor deixa de identificar a superavaliação relevante do estoque:',2,'Os procedimentos do auditor não detectaram a distorção.']]},
{title:'A escola',icon:'🏫',parts:[['🚨','Em uma avaliação, existe a possibilidade de um aluno tentar colar.'],['🛡️','A escola não fiscaliza a prova adequadamente e deixa a irregularidade passar.'],['🔎','Um fiscal externo encarregado de examinar as irregularidades não descobre a fraude.']],qs:[['A possibilidade de cola, antes de considerar a fiscalização, representa:',0,'É a possibilidade natural do problema, antes dos controles.'],['A escola não fiscaliza corretamente a prova. Isso lembra:',1,'A falha está na estrutura de fiscalização interna.'],['O fiscal externo investiga, mas não encontra a fraude. Isso lembra:',2,'O fiscal externo representa o auditor que não detecta o problema.']]},
{title:'A indústria',icon:'🏭',parts:[['🚨','Máquinas complexas exigem estimativas de vida útil e valor residual, sujeitas a incerteza.'],['🛡️','A administração não revisa as estimativas de depreciação e permite erros relevantes.'],['🔎','O auditor não identifica que a despesa de depreciação está materialmente subavaliada.']],qs:[['A incerteza natural das estimativas contábeis é:',0,'O risco existe em razão da natureza das estimativas.'],['A falta de revisão das estimativas pela administração é:',1,'Trata-se de deficiência dos controles da empresa.'],['O auditor não percebe a despesa de depreciação subavaliada:',2,'O erro relevante não foi detectado pelo auditor.']]},
{title:'O condomínio',icon:'🏢',parts:[['🚨','Pagamentos a fornecedores e prestadores estão sujeitos a erros e desvios.'],['🛡️','A administração não exige comprovantes nem realiza conciliações bancárias adequadas.'],['🔎','O auditor analisa a prestação de contas, mas não identifica pagamentos indevidos relevantes.']],qs:[['A possibilidade de erros nos pagamentos, antes dos controles, é:',0,'A natureza das transações cria a suscetibilidade.'],['A ausência de conciliação bancária adequada representa:',1,'É uma falha dos controles internos.'],['O auditor não identifica pagamentos indevidos relevantes:',2,'Os procedimentos do auditor não identificaram a distorção.']]}
];
const names=['Risco inerente','Risco de controle','Risco de detecção'];
const slides=[{type:'cover'},...concepts.map(c=>({type:'concept',c}))];
for(const c of cases){slides.push({type:'case',c});for(let i=0;i<3;i++)slides.push({type:'question',c,i,id:`${cases.indexOf(c)}-${i}`});}
slides.push({type:'end'});
let at=0;let answers={};const screen=document.getElementById('screen');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function render(){const s=slides[at];let html='';if(s.type==='cover')html=`<div class="center emoji">📘🔎</div><div class="eyebrow center">Curso de Contabilidade</div><h1 class="center">Professor Moreira</h1><h2 class="center">Riscos de Auditoria</h2><p class="center">NBC TA 200 • Conceitos, situações práticas e 15 questões</p><div class="center"><span class="pill">📱 Estude no celular</span></div>`;
if(s.type==='concept')html=`<div class="eyebrow">📖 Conceito • NBC TA 200</div><div class="center emoji">${s.c.icon}</div><h2>${s.c.title}</h2><p>${s.c.desc}</p><p class="example"><b>💡 Para memorizar:</b> ${s.c.note}</p>`;
if(s.type==='case')html=`<div class="eyebrow">Situação prática</div><div class="center emoji">${s.c.icon}</div><h2>${s.c.title}</h2>${s.c.parts.map((p,i)=>`<div class="concept"><p><strong>${p[0]} ${names[i]}</strong></p><p>${p[1]}</p></div>`).join('')}<p class="small">Agora responda às três questões sobre esta situação.</p>`;
if(s.type==='question'){const q=s.c.qs[s.i],a=answers[s.id];html=`<div class="eyebrow">📝 Quiz • ${s.c.title} • ${s.i+1}/3</div><h2>${q[0]}</h2><div class="options">${names.map((n,i)=>`<button class="option ${a!==undefined?(i===q[1]?'correct':i===a?'selected wrong':''):''}" data-answer="${i}" ${a!==undefined?'disabled':''}>${String.fromCharCode(65+i)}) ${n}</button>`).join('')}</div>${a!==undefined?`<div class="feedback ${a===q[1]?'good':'bad'}">${a===q[1]?'✅ Resposta correta!':'❌ Resposta incorreta.'}<br><span class="small">Gabarito: ${names[q[1]]}. ${q[2]}</span></div>`:''}`;}
if(s.type==='end'){const all=cases.length*3,correct=slides.filter(x=>x.type==='question'&&answers[x.id]===x.c.qs[x.i][1]).length,done=Object.keys(answers).length;html=`<div class="center emoji">🏆</div><h1 class="center">Resultado final</h1><p class="center">Você respondeu ${done} de ${all} questões.</p><h2 class="center">${correct} acertos</h2><p class="center">${done?Math.round(correct/done*100):0}% de aproveitamento nas respondidas</p><p class="example">🚨 Inerente: natureza do negócio.<br>🛡️ Controle: falha da empresa.<br>🔎 Detecção: falha dos procedimentos do auditor.</p>`;}
screen.innerHTML=html;screen.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{answers[s.id]=Number(b.dataset.answer);save();render();}));const total=Object.keys(answers).length,correct=slides.filter(x=>x.type==='question'&&answers[x.id]===x.c.qs[x.i][1]).length;document.getElementById('score').textContent=`Acertos: ${correct}/${total}`;document.getElementById('progress').style.width=`${(at+1)/slides.length*100}%`;document.getElementById('count').textContent=`${at+1} / ${slides.length}`;document.getElementById('back').disabled=at===0;document.getElementById('next').disabled=at===slides.length-1||(s.type==='question'&&answers[s.id]===undefined);document.getElementById('next').textContent=at===slides.length-2?'Ver resultado →':'Avançar →';}
function save(){try{localStorage.setItem('moreira_riscos_v1',JSON.stringify({at,answers}));}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('moreira_riscos_v1')||'null');if(saved&&Number.isInteger(saved.at)&&saved.at>=0&&saved.at<slides.length){at=saved.at;answers=saved.answers||{};}}catch(e){}
document.getElementById('back').onclick=()=>{if(at>0){at--;save();render();}};document.getElementById('next').onclick=()=>{if(at<slides.length-1){at++;save();render();}};document.getElementById('restart').onclick=()=>{if(confirm('Reiniciar todas as telas e apagar as respostas?')){at=0;answers={};save();render();}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')document.getElementById('back').click();if(e.key==='ArrowRight')document.getElementById('next').click();});render();
</script></body></html>
